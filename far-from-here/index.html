<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f1" />
    <title>Far From Here — 3D / 2D Music Study</title>
    <meta name="description" content="三维雕塑与二维图形的对应研究，结合九段原曲切片、现场打击垫与短促搓碟。图形参考 Emmit Fenn。" />
    <meta property="og:title" content="Far From Here — 3D / 2D Music Study" />
    <meta property="og:image" content="https://bananabox.plus/Assets/img/far-from-here-cover.png" />
    <link rel="icon" type="image/svg+xml" href="/far-from-here/assets/icons/champloo/far-from-here.svg" />
    <script type="module" crossorigin src="/far-from-here/assets/index-DTGhz6-C.js"></script>
    <link rel="modulepreload" crossorigin href="/far-from-here/assets/three-BhaUzKK4.js">
    <link rel="stylesheet" crossorigin href="/far-from-here/assets/index-B1kl2TIH.css">
  </head>
  <body>
    <div id="app">
      <a class="visual-coding-back" href="/visual-coding.html" aria-label="返回 Visual Coding 作品列表" hidden>← VISUAL CODING</a>
      <section class="visual-panel" aria-label="图形展示">
        <header class="header">
          <div class="scene-actions">
            <button id="home" class="home" aria-label="返回完整 3D" disabled hidden>← <span>完整 3D</span></button>
            <button id="assembly" class="assembly" aria-label="展开 3D 部件" aria-expanded="false" disabled><span id="assembly-symbol" aria-hidden="true">+</span><span id="assembly-label">展开</span></button>
          </div>
          <h1>FAR FROM HERE<span>SAMPLE · PERFORM</span></h1>
          <div class="view-controls">
            <div class="listening-mode" role="group" aria-label="交互方式">
              <button id="listen-mix" aria-pressed="true" disabled>演奏</button>
              <button id="listen-solo" aria-pressed="false" disabled>看图</button>
            </div>
            <div id="mode" class="mode" role="group" aria-label="展示方式" hidden>
              <button id="solid" aria-pressed="false">立体</button><button id="flat" aria-pressed="true">平面</button>
            </div>
          </div>
        </header>
        <main id="stage" class="stage" aria-label="图形展示区"></main>
        <div id="loading" class="loading" role="status" aria-live="polite">
          <span id="loading-text">正在准备图形</span>
          <progress id="progress" max="1" value="0" aria-label="资源加载进度"></progress>
          <button id="retry" hidden>重新加载</button>
        </div>
      </section>
      <section class="performance-panel" aria-label="采样打击垫">
        <div class="audio-controls">
          <button id="arm" disabled>准备声音</button>
          <div class="playback-mode" role="group" aria-label="采样播放方式">
            <button id="chop-mono" type="button" aria-pressed="true" title="新采样替换上一段；切回时保留最近触发的一段">互切</button><button id="chop-poly" type="button" aria-pressed="false" title="最多四段采样同时播放；再次触发同一采样会从头播放">叠加</button>
          </div>
          <button id="mix-clear" disabled>停止</button>
          <label class="volume-control"><span>音量</span><input id="volume" type="range" min="0" max="100" value="72" aria-label="总音量" /></label>
          <span id="audio-status" class="sr-only" role="status" aria-live="polite">声音尚未准备</span>
        </div>
        <div class="pad-layout">
          <nav id="artworks" class="artworks" aria-label="九个原曲采样与独立搓碟">
            <button class="artwork" type="button" data-pad-index="1" aria-pressed="false" aria-label="采样 1" disabled><img src="/far-from-here/assets/icons/champloo/edge-of-the-dark.svg" alt="" width="96" height="96" draggable="false" fetchpriority="high"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">W</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="2" aria-pressed="false" aria-label="采样 2" disabled><img src="/far-from-here/assets/icons/champloo/colors.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">↑</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="3" aria-pressed="false" aria-label="采样 3" disabled><img src="/far-from-here/assets/icons/champloo/light-that-shines-through.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">Enter</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="4" aria-pressed="false" aria-label="采样 4" disabled><img src="/far-from-here/assets/icons/champloo/closer-to-you.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">A</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="5" aria-pressed="false" aria-label="采样 5" disabled><img src="/far-from-here/assets/icons/champloo/where-i-went-wrong.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">S</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="6" aria-pressed="false" aria-label="采样 6" disabled><img src="/far-from-here/assets/icons/champloo/until-we-leave-the-ground.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">D</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="7" aria-pressed="false" aria-label="采样 7" disabled><img src="/far-from-here/assets/icons/champloo/we-could-have-it-all.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">←</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="8" aria-pressed="false" aria-label="采样 8" disabled><img src="/far-from-here/assets/icons/champloo/the-table.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">↓</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="9" aria-pressed="false" aria-label="采样 9" disabled><img src="/far-from-here/assets/icons/champloo/moving-on.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><kbd class="pad-key" aria-hidden="true">→</kbd></span></button>
            <button class="artwork" type="button" data-pad-index="0" aria-pressed="false" aria-label="Scratch" disabled><img src="/far-from-here/assets/icons/champloo/far-from-here.svg" alt="" width="96" height="96" draggable="false"><span class="pad-progress" aria-hidden="true"></span><span class="pad-caption"><span>Scratch</span><kbd class="pad-key" aria-hidden="true">Space</kbd></span></button>
          </nav>
          <section class="drum-bank" aria-labelledby="drum-title">
            <h2 id="drum-title">DRUMS</h2>
            <div id="drum-pads" class="drum-pads" role="group" aria-label="独立鼓组"></div>
          </section>
        </div>
        <footer class="footer-note">
          <span>图形参考：Emmit Fenn</span><span>音乐采样：Luv(sic) Part 3 — Nujabes feat. Shing02</span>
        </footer>
        <p id="audio-error" class="audio-error" role="alert" hidden></p>
      </section>
    </div>
    <aside id="performance-guide" class="performance-guide" data-open="false" aria-label="演奏教程">
      <button id="guide-toggle" class="guide-toggle" type="button" aria-expanded="false" aria-controls="guide-panel"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h4"/></svg>演奏指南<span aria-hidden="true">＋</span></button>
      <section id="guide-panel" class="guide-panel" aria-labelledby="guide-title" hidden>
        <header class="guide-header"><div><span class="guide-eyebrow">PERFORMANCE SCORE · 95 BPM</span><h2 id="guide-title">演奏指南</h2></div><button id="guide-collapse" type="button" aria-label="收起演奏指南" title="收起">−</button></header>
        <div class="guide-controls" role="group" aria-label="教程章节"><button type="button" data-guide-page="samples" aria-pressed="true">30 秒演奏</button><button type="button" data-guide-page="drums" aria-pressed="false">手指鼓</button><button type="button" data-guide-page="keys" aria-pressed="false">键位与操作</button></div>
        <div class="guide-demo-controls"><button id="guide-demo-play" type="button" disabled>▶ 播放示范</button><button id="guide-demo-stop" type="button" disabled>停止示范</button><span id="guide-demo-time">约 30 秒</span><span class="guide-demo-progress" aria-hidden="true"></span></div>
        <div class="guide-body" tabindex="0" role="region" aria-label="演奏谱与操作说明"></div>
        <footer class="guide-footer"><span id="guide-state" role="status" aria-live="polite">先准备声音</span><span class="guide-legend"><span>■ 按下</span><span>□ 发声</span><span>┄ 待加载</span></span></footer>
      </section>
    </aside>
  </body>
</html>
