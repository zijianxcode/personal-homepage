<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="theme-color" content="#fafaf8">
  <title>Vibe Fiber — 织字实验</title>
  <meta name="description" content="在织物上输入文字、导入图案，体验针织与机织动画，自定义纱线、材质和面板布局。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2322221d'/%3E%3Cpath d='M12 15Q18 40 32 50Q46 40 52 15' fill='none' stroke='%23ddd6c8' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=20261007-back-nav">
</head>
<body>
  <a class="visual-coding-back" href="/visual-coding.html" aria-label="返回 Visual Coding 作品列表">← VISUAL CODING</a>
  <main id="workspace" aria-label="Knitted text workspace">
    <canvas id="cloth" aria-label="Click and type to knit. Scroll to zoom; drag to pan." tabindex="0"></canvas>
    <p id="keyboard-help" class="sr-only">Click the fabric and type. Enter creates a new line. Backspace unravels stitches. Mouse wheel zooms. Drag pans the view.</p>
    <span id="empty-hint" aria-hidden="true">CLICK & TYPE</span>
    <span id="status" class="sr-only" role="status" aria-live="polite"></span>

    <section id="input-panel" class="panel input-panel" aria-label="文字与图案输入">
      <header class="panel-head"><span>输入</span><button class="fold" aria-label="Collapse input" aria-expanded="true" aria-controls="input-body">⌄</button></header>
      <div id="input-body" class="panel-body">
        <div class="input-tabs" role="group" aria-label="输入内容"><button data-input="text" class="selected" aria-pressed="true">文字</button><button data-input="pattern" aria-pressed="false">图案</button></div>
        <div id="text-input-body">
          <label class="sr-only" for="text">文字内容</label>
          <textarea id="text" maxlength="1200" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-describedby="keyboard-help">Vibe
Fiber</textarea>
          <div class="input-footer"><span id="text-count">10 / 1200</span><button id="clear-text" type="button">清空文字</button></div>
        </div>
        <div id="pattern-input-body" hidden>
          <input id="image-file" type="file" accept="image/*" class="sr-only" tabindex="-1">
          <button id="upload-image" class="upload-button" type="button">＋ 导入图片</button>
          <button id="sample-pattern" class="sample-button" type="button">花朵示例</button>
          <div id="pattern-controls" hidden>
            <div class="image-previews"><figure><img id="original-preview" alt="导入的原图"><figcaption>原图</figcaption></figure><figure><canvas id="outline-preview" width="96" height="96" aria-label="提取后的图案"></canvas><figcaption>提取图案</figcaption></figure></div>
            <label class="input-label" for="pattern-method">提取方式</label>
            <select id="pattern-method"><option value="outline">轮廓</option><option value="line">线稿</option><option value="solid">剪影</option></select>
            <div class="slider"><label for="sensitivity">敏感度</label><input id="sensitivity" type="range" min="0" max="100" value="50"><output id="sensitivity-value" for="sensitivity">50</output></div>
            <div class="slider"><label for="thickness">线条粗细</label><input id="thickness" type="range" min="1" max="5" value="2"><output id="thickness-value" for="thickness">2</output></div>
            <div class="slider"><label for="pattern-scale">图案大小</label><input id="pattern-scale" type="range" min="30" max="90" value="70"><output id="pattern-scale-value" for="pattern-scale">70</output></div>
            <button id="remove-image" class="remove-image" type="button">移除图案</button>
          </div>
          <p id="image-status" class="image-status" role="status" aria-live="polite" hidden></p>
        </div>
      </div>
    </section>

    <section id="yarn-panel" class="panel yarn-panel" aria-label="Yarn settings">
      <header class="panel-head"><span>纱线</span><button class="reset" data-reset="yarn" aria-label="Reset yarn" title="Reset yarn">↻</button><button class="fold" aria-label="Collapse yarn" aria-expanded="true" aria-controls="yarn-body">⌄</button></header>
      <div id="yarn-body" class="panel-body">
        <div class="swatches" role="group" aria-label="Yarn colors"></div>
        <div class="slider"><label for="halo">绒毛</label><input id="halo" type="range" min="0" max="100" value="46"><output id="halo-value" for="halo">46</output></div>
        <div class="slider"><label for="strays">散线</label><input id="strays" type="range" min="0" max="100" value="34"><output id="strays-value" for="strays">34</output></div>
      </div>
    </section>

    <section id="type-panel" class="panel type-panel" aria-label="Type settings">
      <header class="panel-head"><span>排版</span><button class="reset" data-reset="type" aria-label="Reset type" title="Reset type">↻</button><button class="fold" aria-label="Collapse type" aria-expanded="true" aria-controls="type-body">⌄</button></header>
      <div id="type-body" class="panel-body">
        <div class="button-group alignment" role="group" aria-label="Text alignment">
          <button data-align="left" aria-label="Align left" aria-pressed="false" title="Align left"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 7h6M3 10h10M3 13h6"/></svg></button>
          <button data-align="center" class="selected" aria-label="Align center" aria-pressed="true" title="Align center"><svg viewBox="0 0 16 16"><path d="M3 4h10M5 7h6M3 10h10M5 13h6"/></svg></button>
          <button data-align="right" aria-label="Align right" aria-pressed="false" title="Align right"><svg viewBox="0 0 16 16"><path d="M3 4h10M7 7h6M3 10h10M7 13h6"/></svg></button>
        </div>
        <div class="slider"><label for="size">字号</label><input id="size" type="range" min="8" max="32" step="1" value="16"><output id="size-value" for="size">16</output></div>
        <div class="space-mode"><span>空格键</span><div class="button-group" role="group" aria-label="Space bar behavior"><button data-space="space" class="selected" aria-label="Space bar inserts a space" aria-pressed="true" title="Space"><svg viewBox="0 0 16 16"><path d="M3 5v5h10V5"/></svg></button><button data-space="line" aria-label="Space bar inserts a line break" aria-pressed="false" title="Line break"><svg viewBox="0 0 16 16"><path d="M12 3v6H4m3-3L4 9l3 3"/></svg></button></div></div>
      </div>
    </section>

    <section id="fabric-panel" class="panel fabric-panel collapsed" aria-label="Fabric settings">
      <header class="panel-head"><span>织物</span><button class="reset" data-reset="fabric" aria-label="Reset fabric" title="Reset fabric">↻</button><button class="fold" aria-label="Expand fabric" aria-expanded="false" aria-controls="fabric-body">⌃</button></header>
      <div id="fabric-body" class="panel-body" hidden>
        <label class="sr-only">织入工艺</label>
        <div class="construction-buttons" role="group" aria-label="织入工艺"><button data-construction="knit" aria-pressed="true" class="selected">针织嵌花</button><button data-construction="weave" aria-pressed="false">机织提花</button></div>
        <div class="process-buttons"><button id="play-weave">播放织造</button><button id="pause-weave" disabled>暂停</button><button id="finish-weave" disabled>看成品</button></div>
        <div class="process-progress"><progress id="weave-progress" max="100" value="0" aria-label="织造进度"></progress><output id="weave-percent">0%</output></div>
        <p id="weave-status" class="sr-only" role="status" aria-live="polite"></p>
        <label class="surface-label" for="surface">表面形态</label>
        <select id="surface" aria-describedby="surface-description"></select>
        <canvas id="surface-preview" width="144" height="48" aria-label="所选表面形态预览"></canvas>
        <p id="surface-description" class="sr-only"></p>
        <div class="slider"><label for="inlay">织入程度</label><input id="inlay" type="range" min="0" max="100" value="75"><output id="inlay-value" for="inlay">75</output></div>
        <div class="fabric-swatches" role="group" aria-label="Fabric color"><button class="selected" data-fabric="cream" aria-label="Natural fabric" aria-pressed="true" style="--color:#ded9cb"></button><button data-fabric="white" aria-label="Ivory fabric" aria-pressed="false" style="--color:#ece8df"></button><button data-fabric="rose" aria-label="Rose fabric" aria-pressed="false" style="--color:#d7bab0"></button><button data-fabric="dark" aria-label="Charcoal fabric" aria-pressed="false" style="--color:#454b42"></button><button data-fabric="blue" aria-label="Blue fabric" aria-pressed="false" style="--color:#94aab5"></button><button data-fabric="clay" aria-label="陶土织物" aria-pressed="false" style="--color:#b96543"></button></div>
        <div class="slider"><label for="pitch">线距</label><input id="pitch" type="range" min="7" max="15" value="10"><output id="pitch-value" for="pitch">10</output></div>
      </div>
    </section>
    <section id="motif-panel" class="panel motif-panel" aria-label="图案库">
      <header class="panel-head"><span>图案</span><button class="fold" aria-label="Collapse motif" aria-expanded="true" aria-controls="motif-body">⌄</button></header>
      <div id="motif-body" class="panel-body">
        <div class="motif-mode" role="group" aria-label="插入方式"><button data-motif-mode="single" class="selected" aria-pressed="true">单个</button><button data-motif-mode="row" aria-pressed="false">整行</button></div>
        <div id="motif-grid" class="motif-grid" role="group" aria-label="选择图案"></div>
      </div>
    </section>
    <button id="reset-layout" type="button" title="恢复布局"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5a5 5 0 1 1-.4 5M3 2v3h3"/></svg>恢复布局</button>
    <p id="layout-help" class="sr-only">拖动面板标题移动，拖动右下角调整大小。聚焦移动或缩放控件后，方向键微调，Shift 加速。</p>
  </main>
  <script src="pattern-algorithms.js"></script><script src="image-pattern.js"></script><script src="surface-presets.js"></script><script src="weave-process.js?v=20261006-sequence5"></script><script src="motifs.js"></script><script src="renderer.js?v=20261007-performance1"></script><script src="panel-layout.js"></script><script src="app.js?v=20261006-sequence5"></script>
</body>
</html>
