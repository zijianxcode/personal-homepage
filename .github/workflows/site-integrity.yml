name: site-integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check site integrity
        run: npm run test:site-integrity

      - name: Check protected course access
        run: npm run test:things-access

      - name: Check API access boundaries
        run: npm run test:security
